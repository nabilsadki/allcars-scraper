<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Avito — catalogue{% endblock %}</title>
<link rel="icon" href="/static/favicon.svg?v={{ asset_version('favicon.svg') }}" type="image/svg+xml">
<link rel="alternate icon" href="/static/favicon.svg">
<link rel="apple-touch-icon" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/style.css?v={{ asset_version('style.css') }}">
<script>
// applique le theme avant le rendu (pas de flash)
(function () {
  try {
    if (localStorage.getItem('theme') === 'light') {
      document.documentElement.classList.add('light');
    }
  } catch (e) {}
})();
</script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">🚗 Avito <span class="sub">catalogue</span></a>
  <nav class="mainnav">
    <a href="/" class="{{ 'on' if request.path == '/' else '' }}">Catalogue</a>
    <a href="/tracking" class="{{ 'on' if request.path == '/tracking' else '' }}">Suivi du scrap</a>
    <button type="button" id="theme-toggle" class="theme-toggle"
            title="Basculer le theme clair / sombre">🌙</button>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer>Scraper avito.ma — HTTP sans navigateur · données locales</footer>

<div id="loader" class="loader"><div class="spinner"></div><span>Chargement…</span></div>
<script>
// bascule du theme (clair / sombre), memorise dans le navigateur
(function () {
  const btn = document.getElementById('theme-toggle');
  if (!btn) return;
  const apply = (light) => {
    document.documentElement.classList.toggle('light', light);
    btn.textContent = light ? '☀' : '🌙';
    btn.title = light ? 'Passer en theme sombre' : 'Passer en theme clair';
  };
  let light = false;
  try { light = localStorage.getItem('theme') === 'light'; } catch (e) {}
  apply(light);
  btn.addEventListener('click', () => {
    light = !light;
    try { localStorage.setItem('theme', light ? 'light' : 'dark'); } catch (e) {}
    apply(light);
  });
})();

// loader : affiche un voile tant qu'une action (formulaire, lien) est en cours
(function () {
  const loader = document.getElementById('loader');
  const show = () => loader && loader.classList.add('on');
  document.addEventListener('submit', show, true);
  document.addEventListener('click', (e) => {
    const a = e.target.closest && e.target.closest('a');
    if (a && !a.target && a.getAttribute('href')) show();
  });
  const hide = () => loader && loader.classList.remove('on');
  window.addEventListener('pageshow', hide);
  window.addEventListener('load', hide);
  setTimeout(hide, 20000);
})();
</script>
</body>
</html>
