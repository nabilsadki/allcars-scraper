# ---------------------------------------------------------------------------
#  Scraper avito.ma — tout tourne en Docker (DB + scraper + outils + web).
#
#  Persistance de l'interface : les services `db` et `web` ont la politique
#  de redemarrage "unless-stopped" : ils se relancent tout seuls au redemarrage
#  du poste (Docker demarre au boot), l'interface reste donc toujours
#  accessible.
#
#  IMPORTANT : aucun SCRAP n'est lance automatiquement.
#  - `app` et `tools` restent en restart: "no"
#  - pas de service cron / scheduler
#  Le scrap se lance depuis l'interface (page /tracking) ou en ligne de commande :
#      docker compose run --rm app list --category "..." --db
#  L'interface lance un conteneur ephemere par site (docker compose run -d --rm)
#  : les sites peuvent scraper en parallele, rien ne traine apres le run.
#  Les volumes (donnees MySQL + dumps) persistent sur /mnt/4TB.
# ---------------------------------------------------------------------------

name: avito-scraper

services:
  # ---------------------------------------------------------------- base
  db:
    build:
      context: ./services/db
    image: avito-scraper-db:latest
    container_name: avito-db
    # la base doit suivre l'interface (qui doit rester accessible)
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-avito}
      MYSQL_USER: ${MYSQL_USER:-avito}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-avito}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      # les donnees MySQL vivent dans le dossier du projet (disque 4 To),
      # pas dans un volume Docker sur le disque racine
      - ./data/mysql:/var/lib/mysql
    ports:
      # accessible seulement en local, pour inspecter avec un client
      - "127.0.0.1:${DB_PORT_HOST:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # ------------------------------------------------------------- scraper
  app:
    build:
      context: ./services/app
    image: avito-scraper-app:latest
    container_name: avito-app
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-avito}
      DB_USER: ${DB_USER:-avito}
      DB_PASSWORD: ${DB_PASSWORD:-avito}
      SCORING_CONFIG: /app/config/scoring.json
    volumes:
      # donnees scrapees (JSONL/CSV, images, progression) : dans le projet (4 To)
      - ./data/scraped:/data
      # config du scoring v2 : modifiable sans rebuild
      - ./services/app/config:/app/config:ro
    # usage :
    #   docker compose run --rm app list   --category "..." --db
    #   docker compose run --rm app rescan --category "..." --details
    entrypoint: ["python3", "-m", "scraper.cli"]

  # -------------------------------------------------------------- outils
  tools:
    build:
      context: ./services/app
    image: avito-scraper-app:latest
    container_name: avito-tools
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-avito}
      DB_USER: ${DB_USER:-avito}
      DB_PASSWORD: ${DB_PASSWORD:-avito}
      SCORING_CONFIG: /app/config/scoring.json
    volumes:
      - ./data/scraped:/data
      - ./services/app/config:/app/config:ro
    entrypoint: ["python3", "-m", "scraper.query"]

  # ---------------------------------------------------------------- web
  web:
    build:
      context: ./services/web
    image: avito-scraper-web:latest
    container_name: avito-web
    # l'interface doit rester accessible (elle survit au redemarrage du PC)
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-avito}
      DB_USER: ${DB_USER:-avito}
      DB_PASSWORD: ${DB_PASSWORD:-avito}
      IMAGES_DIR: /data/images
      PROGRESS_DIR: /data/progress
      SCRAPE_JOB_FILE: /data/scrape_job.json
      # pilotage des scrapes (un conteneur ephemere par site)
      COMPOSE_PROJECT_DIR: /mnt/4TB/scraper-avito
      SCRAPER_SERVICE: app
      SCRAPER_PREFIX: avito-scraper
    volumes:
      - ./data/scraped:/data
      # socket Docker + projet compose : l'interface lance les scrapes avec
      # "docker compose run" (la config reste dans docker-compose.yml)
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/4TB/scraper-avito:/mnt/4TB/scraper-avito:ro
    group_add:
      # groupe "docker" de l'hote (pour l'acces au socket)
      - "${DOCKER_GID:-999}"
    ports:
      # accessible depuis le reseau local + le tailnet (via tailscale serve)
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

# Aucun volume Docker nomme : toutes les donnees sont dans ./data (4 To).
volumes: {}
